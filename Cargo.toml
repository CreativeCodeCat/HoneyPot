[package]
name = "honeypot-bot"
version = "0.1.1"
edition = "2021"

[workspace]
members = ["macros"]

[dependencies]
honeypot-macros = { path = "macros" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The gateway uses OpenSSL (built in, for the static `make dist` binary) rather than serenity's
# rustls backend, whose old rustls 0.22 has known security issues
serenity = { version = "0.12.5", default-features = false, features = [
    "builder", "cache", "chrono", "client", "collector", "framework", "gateway", "model", "native_tls_backend", "utils",
] }
native-tls = { version = "0.2", features = ["vendored"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dotenvy = "0.15"
regex = "1"
unicode-normalization = "0.1"
chrono = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
rand = "0.9"
tiny-skia = "0.11"
ab_glyph = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
resvg = { version = "0.45", default-features = false }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
