[package]
name = "honeypot-macros"
version = "0.1.0"
edition = "2021"
description = "The #[command] attribute and #[derive(Choice)] for the HoneyPot bot's command framework"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
